<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Playlist Video</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 system-ui, sans-serif;
    max-width: 32rem; margin: 3rem auto; padding: 0 1rem;
  }
  input { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
  button { margin-top: .75rem; padding: .5rem 1rem; font: inherit; }
  .open {
    display: block; margin-top: 1rem; padding: 1rem;
    border-radius: .75rem; background: #c4302b; color: #fff;
    font-size: 1.25rem; font-weight: 600; text-align: center;
    text-decoration: none;
  }
  .hint { color: #c62828; margin: .5rem 0 0; }
  #bookmark-box {
    overflow-wrap: anywhere; padding: .75rem 1rem; border-radius: .5rem;
    background: #dbeafe; color: #1e293b;
  }
  #bookmark-box a { color: #1d4ed8; }
  .error { color: #c62828; }
  [hidden] { display: none; }
</style>
</head>
<body>
<p id="status">Loading…</p>

<a id="open" class="open" hidden>Open in YouTube</a>

<form id="list-form" hidden>
  <label for="list">Playlist link or ID</label>
  <input id="list" autocomplete="off" required
    placeholder="Paste a YouTube playlist or video link">
  <p id="hint" class="hint" hidden></p>
  <p id="bookmark-box" hidden>
    Bookmark this link to shuffle from this playlist in the future: <a id="bookmark"></a>
  </p>
  <button>Go</button>
</form>

<script>
"use strict";

// Replaced with the real key by .github/workflows/pages.yml at deploy time.
const API_KEY = "__YT_API_KEY__";
const CACHE_TTL = 24 * 60 * 60 * 1000;   // ms

const $ = (id) => document.getElementById(id);

function showStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
}

// Earlier versions stored the visitor's own key in this cookie.
document.cookie = "yt_api_key=; max-age=0; SameSite=Strict; Secure";

// Phones and tablets. iPadOS reports itself as a Mac, so check for touch.
function isMobile() {
  const ua = navigator.userAgent;
  return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
    (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
}

// --- Playlist cache (per-browser convenience; works without it) ---

function readCache(list) {
  try {
    const cached = JSON.parse(localStorage.getItem("playlist:" + list));
    if (cached && Date.now() - cached.time < CACHE_TTL && cached.ids.length) {
      return cached.ids;
    }
  } catch {}
  return null;
}

function writeCache(list, ids) {
  try {
    const value = JSON.stringify({ time: Date.now(), ids });
    localStorage.setItem("playlist:" + list, value);
  } catch {}
}

// --- YouTube Data API ---

class ApiError extends Error {
  constructor(message, reason) { super(message); this.reason = reason; }
}

async function fetchPlaylist(list) {
  const ids = [];
  let pageToken = "";
  do {
    const params = new URLSearchParams({
      part: "contentDetails,status", playlistId: list,
      maxResults: "50", key: API_KEY,
    });
    if (pageToken) params.set("pageToken", pageToken);
    const res = await fetch(
      "https://www.googleapis.com/youtube/v3/playlistItems?" + params);
    const data = await res.json();
    if (data.error) {
      const reason = data.error.errors?.[0]?.reason ?? data.error.status;
      throw new ApiError(data.error.message, reason);
    }
    for (const item of data.items) {
      const privacy = item.status?.privacyStatus;
      // Deleted videos show up as "privacyStatusUnspecified".
      if (privacy === "public" || privacy === "unlisted") {
        ids.push(item.contentDetails.videoId);
      }
    }
    pageToken = data.nextPageToken ?? "";
  } while (pageToken);
  return ids;
}

// --- Playlist input ---

// Accepts a playlist or video link containing ?list=..., or a bare ID.
function extractListId(text) {
  text = text.trim();
  if (!text) return null;
  try {
    const url = new URL(/^[a-z]+:\/\//i.test(text) ? text : "https://" + text);
    const list = url.searchParams.get("list");
    if (list) return list;
  } catch {}
  return /^[\w-]{10,}$/.test(text) ? text : null;
}

function bookmarkUrl(list) {
  return location.origin + location.pathname +
    "?list=" + encodeURIComponent(list);
}

function setupForm() {
  showStatus("Which playlist?");
  $("list-form").hidden = false;
  $("list").focus();

  $("list").oninput = () => {
    const text = $("list").value;
    const list = extractListId(text);
    const url = list && bookmarkUrl(list);
    $("bookmark").href = url || "";
    $("bookmark").textContent = url || "";
    $("bookmark-box").hidden = !url;
    $("hint").textContent = "No playlist ID found in that link.";
    $("hint").hidden = !text.trim() || !!list;
  };

  $("list-form").onsubmit = (e) => {
    e.preventDefault();
    const list = extractListId($("list").value);
    if (list) location.href = bookmarkUrl(list);
    else $("list").oninput();
  };
}

async function main() {
  const list = new URLSearchParams(location.search).get("list");
  if (!list) return setupForm();

  let ids = readCache(list);
  if (!ids) {
    if (API_KEY.startsWith("__")) {
      return showStatus("This site has no API key configured.", true);
    }
    try {
      ids = await fetchPlaylist(list);
    } catch (err) {
      if (err instanceof ApiError && err.reason === "playlistNotFound") {
        return showStatus("Playlist not found. Check the ID, and make " +
          "sure it's public or unlisted.", true);
      }
      if (err instanceof ApiError && err.reason === "quotaExceeded") {
        return showStatus("The site's daily YouTube quota is used up. " +
          "Try again tomorrow.", true);
      }
      return showStatus("Couldn't load the playlist: " + err.message, true);
    }
    if (!ids.length) {
      return showStatus("This playlist has no playable videos.", true);
    }
    writeCache(list, ids);
  }

  const pick = ids[Math.floor(Math.random() * ids.length)];
  const url = `https://www.youtube.com/watch?v=${pick}` +
    `&list=${encodeURIComponent(list)}`;

  // iOS and Android only open the YouTube app for a navigation the user
  // started with a tap, so mobile gets a button instead of a redirect.
  if (isMobile()) {
    showStatus("Random video picked.");
    $("open").href = url;
    $("open").hidden = false;
  } else {
    location.replace(url);
  }
}

main();
</script>
</body>
</html>
